name: IniMod portable archives
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
concurrency:
  group: archives-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  linux-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - {arch: amd64, platform: linux/amd64, runtime_platform: linux/amd64}
          - {arch: i386, platform: linux/386, runtime_platform: linux/amd64}
          - {arch: arm64, platform: linux/arm64, runtime_platform: linux/arm64}
          - {arch: armhf, platform: linux/arm/v7, runtime_platform: linux/arm/v7}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build and test portable executable
        run: docker buildx build --platform '${{ matrix.target.platform }}' --output type=local,dest=out -f Dockerfile.portable .
      - uses: actions/upload-artifact@v4
        with:
          name: inimod-linux-${{ matrix.target.arch }}
          path: out/*.tar.gz
  linux-runtime:
    needs: linux-build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ['debian:bullseye-slim', 'debian:bookworm-slim', 'debian:trixie-slim', 'ubuntu:24.04', 'ubuntu:26.04']
        target:
          - {arch: amd64, platform: linux/amd64, runtime_platform: linux/amd64}
          - {arch: i386, platform: linux/386, runtime_platform: linux/amd64}
          - {arch: arm64, platform: linux/arm64, runtime_platform: linux/arm64}
          - {arch: armhf, platform: linux/arm/v7, runtime_platform: linux/arm/v7}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: actions/download-artifact@v4
        with:
          name: inimod-linux-${{ matrix.target.arch }}
          path: out
      - name: Exercise the same archive on all selected systems
        run: |
          mkdir runtime
          tar -xzf out/inimod-1.0-linux-${{ matrix.target.arch }}.tar.gz -C runtime
          test "$(find runtime -maxdepth 1 -type f | wc -l)" = 2
          docker run --rm --platform '${{ matrix.target.runtime_platform }}' -e TOOL_ARCH='${{ matrix.target.arch }}' -v "$PWD:/work:ro" -w /work '${{ matrix.image }}' sh -ec '. /etc/os-release; if [ "${VERSION_CODENAME:-}" = bullseye ]; then printf "deb http://deb.debian.org/debian bullseye main\ndeb [check-valid-until=no] http://archive.debian.org/debian-security bullseye-security main\n" > /etc/apt/sources.list; fi; if [ "$TOOL_ARCH" = i386 ]; then dpkg --add-architecture i386; fi; apt-get update; if [ "$TOOL_ARCH" = i386 ]; then apt-get install -y --no-install-recommends python3 libc6:i386; else apt-get install -y --no-install-recommends python3; fi; python3 tests/test_cli.py /work/runtime/inimod'
  windows-build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - {arch: x86, bits: '32', suffix: win32}
          - {arch: x64, bits: '64', suffix: win64}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lazarus and Free Pascal
        shell: pwsh
        run: |
          $url = 'https://downloads.sourceforge.net/project/lazarus/Lazarus%20Windows%20${{ matrix.target.bits }}%20bits/Lazarus%204.4/lazarus-4.4-fpc-3.2.2-${{ matrix.target.suffix }}.exe'
          $installer = Join-Path $env:RUNNER_TEMP 'lazarus-setup.exe'
          & curl.exe --fail --location --retry 4 --output $installer $url
          if ($LASTEXITCODE) { throw 'Compiler download failed.' }
          $bytes = [IO.File]::ReadAllBytes($installer)
          if ($bytes.Length -lt 100MB -or $bytes[0] -ne 0x4d -or $bytes[1] -ne 0x5a) { throw 'Compiler download is not a complete executable.' }
          $destination = Join-Path $env:RUNNER_TEMP 'lazarus'
          $process = Start-Process $installer -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', ('/DIR=' + $destination)) -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Lazarus installation failed: $($process.ExitCode)" }
      - name: Build and exercise native executable
        shell: pwsh
        run: |
          ./Build-Windows.ps1 -LazarusDirectory "$env:RUNNER_TEMP/lazarus" -OutputDirectory "$env:RUNNER_TEMP/native" -Architecture '${{ matrix.target.arch }}'
          python tests/test_cli.py "$env:RUNNER_TEMP/native/inimod.exe"
          if ($LASTEXITCODE) { throw 'Native command regression test failed.' }
          $spaced = Join-Path $env:RUNNER_TEMP 'command with spaces'
          New-Item -ItemType Directory $spaced | Out-Null
          Copy-Item "$env:RUNNER_TEMP/native/inimod.exe" $spaced
          python tests/test_cli.py (Join-Path $spaced 'inimod.exe')
          if ($LASTEXITCODE) { throw 'Spaced executable path regression test failed.' }
      - uses: actions/upload-artifact@v4
        with:
          name: inimod-native-${{ matrix.target.arch }}
          path: |
            ${{ runner.temp }}/native/inimod.exe
            ${{ runner.temp }}/native/*.md
            ${{ runner.temp }}/native/*.txt
            ${{ runner.temp }}/native/COPYING*
            ${{ runner.temp }}/native/SHA256SUMS
  windows-archive:
    needs: windows-build
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x86, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: inimod-native-${{ matrix.arch }}
          path: ${{ runner.temp }}/native
      - name: Create and test portable archive
        shell: pwsh
        run: |
          $hash = ((Get-Content "$env:RUNNER_TEMP/native/SHA256SUMS") -split '\s+')[0]
          ./New-WindowsArchive.ps1 -BinaryDirectory "$env:RUNNER_TEMP/native" -OutputDirectory "$env:RUNNER_TEMP/archive" -ExpectedSHA256 $hash -Architecture '${{ matrix.arch }}'
          Expand-Archive "$env:RUNNER_TEMP/archive/inimod-1.0-windows-${{ matrix.arch }}.zip" "$env:RUNNER_TEMP/extracted archive"
          if (@(Get-ChildItem "$env:RUNNER_TEMP/extracted archive" -File).Count -ne 2) { throw 'Archive must contain exactly two files.' }
          python tests/test_cli.py "$env:RUNNER_TEMP/extracted archive/inimod.exe"
          if ($LASTEXITCODE) { throw 'Extracted archive regression test failed.' }
      - uses: actions/upload-artifact@v4
        with:
          name: inimod-windows-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/archive/*.zip
            ${{ runner.temp }}/archive/SHA256SUMS
